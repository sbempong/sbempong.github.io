name: Now feeds (Last.fm, AniList, Trakt, Hardcover)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lastfm-recent
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: cfg
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USER: ${{ vars.LASTFM_USER }}
        run: |
          if [ -z "$LASTFM_API_KEY" ] || [ -z "$LASTFM_USER" ]; then
            echo "LASTFM_API_KEY secret or LASTFM_USER variable is not set; skipping."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out
        if: steps.cfg.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Fetch recent tracks
        if: steps.cfg.outputs.enabled == 'true'
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USER: ${{ vars.LASTFM_USER }}
        run: |
          set -euo pipefail
          # The key is passed only through curl's --data-urlencode and is never printed.
          if ! curl -fsS --get "https://ws.audioscrobbler.com/2.0/" \
              --data-urlencode "method=user.getRecentTracks" \
              --data-urlencode "user=${LASTFM_USER}" \
              --data-urlencode "api_key=${LASTFM_API_KEY}" \
              --data-urlencode "limit=100" \
              --data-urlencode "format=json" \
              -o /tmp/raw.json 2>/dev/null; then
            echo "Last.fm request failed; leaving data/recent.json unchanged."
            exit 0
          fi
          if jq -e '.error' /tmp/raw.json >/dev/null; then
            echo "Last.fm returned an error: $(jq -r '.message // "unknown"' /tmp/raw.json)"
            exit 0
          fi
          # Art: 'extralarge' (300 px), else 'large' (174 px), else 'medium'; artSmall is the 174 px
          # version for srcset. Empty urls and the default star placeholder
          # (hash 2a96cbd8b46e442fc41c2b86b821562f) count as missing -> null.
          # Output: tracks (latest 4, for the Home line) and albums (latest 6 distinct albums).
          jq '
            def good: (. // "") as $u | if ($u == "" or ($u | contains("2a96cbd8b46e442fc41c2b86b821562f"))) then null else $u end;
            def pick($s): ([.image[]? | select(.size == $s) | .["#text"] | good] | map(select(. != null)) | .[0]);
            def enc: @uri | gsub("%20"; "+");
            [ (.recenttracks.track // []) | (if type == "array" then .[] else . end) | {
                title: .name,
                artist: (.artist["#text"] // .artist.name // ""),
                album: ((.album["#text"] // "") | if . == "" then null else . end),
                art: (pick("extralarge") // pick("large") // pick("medium")),
                artSmall: (pick("large") // pick("medium")),
                url: .url,
                nowPlaying: ((.["@attr"].nowplaying // "") == "true"),
                playedAt: (if .date.uts then (.date.uts | tonumber | todate) else null end)
              } | select(.title != null and .title != "") ] as $t
            # Albums: group by main artist (before any ", ", " & " or "feat") + album, so featured-artist
            # variants merge; tracks with no album group by title; newest play first; shortest artist credit shown.
            | ($t | reduce .[] as $x ([];
                (((($x.artist | ascii_downcase) | split(", ")[0] | split(" & ")[0] | split(" feat")[0] | split(" ft.")[0]) + "|" + (if $x.album then "a:" + ($x.album | ascii_downcase) else "t:" + ($x.title | ascii_downcase) end))) as $k
                | (map(.key) | index($k)) as $i
                | if $i == null then . + [{key: $k, album: ($x.album // $x.title), artist: $x.artist, isTrack: ($x.album == null),
                      art: $x.art, artSmall: $x.artSmall,
                      url: (if $x.album then "https://www.last.fm/music/" + ($x.artist | enc) + "/" + ($x.album | enc) else $x.url end),
                      titles: [$x.title | ascii_downcase], plays: 1, lastPlayedAt: $x.playedAt,
                      nowPlaying: $x.nowPlaying, nowTrack: (if $x.nowPlaying then $x.title else null end)}]
                  else .[$i] |= (.plays += 1 | .titles = ((.titles + [$x.title | ascii_downcase]) | unique)
                      | .artist = (if ($x.artist | length) < (.artist | length) then $x.artist else .artist end)
                      | .art = (.art // $x.art) | .artSmall = (.artSmall // $x.artSmall) | .lastPlayedAt = (.lastPlayedAt // $x.playedAt)) end)
              | map(.songs = (.titles | length) | del(.key, .titles)) | .[:6]) as $albums
            | { tracks: $t[:4], albums: $albums }' /tmp/raw.json > /tmp/recent.json
          mkdir -p data
          cp /tmp/recent.json data/recent.json

      - name: Commit if changed
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          if git diff --quiet -- data/recent.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recent.json
          git commit -m "Update recently played"
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 5; done
          exit 1

  anilist:
    # Independent of the Last.fm job: no secret needed, and a failure here never touches data/recent.json.
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Fetch AniList lists
        env:
          ANILIST_USER: geekslyy
        run: |
          set -euo pipefail
          q='query($u:String,$t:MediaType){MediaListCollection(userName:$u,type:$t,status:CURRENT){lists{entries{progress updatedAt media{id siteUrl title{english romaji} coverImage{medium large extraLarge} format countryOfOrigin episodes chapters description(asHtml:false)}}}}}'
          for t in ANIME MANGA; do
            body=$(jq -cn --arg q "$q" --arg u "$ANILIST_USER" --arg t "$t" '{query:$q,variables:{u:$u,t:$t}}')
            if ! curl -fsS --retry 2 https://graphql.anilist.co -H 'Content-Type: application/json' -H 'Accept: application/json' -d "$body" -o "/tmp/$t.json"; then
              echo "AniList request for $t failed; leaving data/anilist.json unchanged."; exit 0
            fi
            if ! jq -e '.data.MediaListCollection' "/tmp/$t.json" >/dev/null || jq -e '.errors' "/tmp/$t.json" >/dev/null; then
              echo "AniList returned an error for $t: $(jq -c '.errors // "no data"' "/tmp/$t.json")"; exit 0
            fi
          done
          # Compact, key-stable output so an unchanged list never produces a formatting-only commit.
          jq -c -n --slurpfile a /tmp/ANIME.json --slurpfile m /tmp/MANGA.json '
            def good: (. // "") as $u | if ($u | test("^https://")) then $u else null end;
            # Plain text: drop tags, decode common entities, drop "(Source: ...)" notes, collapse spaces, cap at 600 characters.
            def desc($d): ($d // "") | gsub("<br\\s*/?>"; " ") | gsub("<[^>]*>"; "")
              | gsub("&quot;"; "\"") | gsub("&#0?39;|&apos;|&rsquo;"; "\u0027") | gsub("&mdash;|&ndash;"; "-") | gsub("&nbsp;"; " ") | gsub("&amp;"; "&") | gsub("&lt;"; "<") | gsub("&gt;"; ">")
              | gsub("\\(Source:[^)]*\\)"; "") | gsub("\\s+"; " ") | ltrimstr(" ") | rtrimstr(" ")
              | if . == "" then null elif length > 600 then .[:600] | sub(" [^ ]*$"; "") + "..." else . end;
            def items($d; $unit): [ $d[0].data.MediaListCollection.lists[]?.entries[]? ]
              | sort_by(-.updatedAt) | .[:4] | map({
                  id: .media.id,
                  title: (.media.title.english // .media.title.romaji // ""),
                  progress: (.progress // 0),
                  unit: $unit,
                  url: .media.siteUrl,
                  total: (if $unit == "Ep" then .media.episodes else .media.chapters end),
                  description: (desc(.media.description)),
                  cover: ((.media.coverImage.large | good) // (.media.coverImage.medium | good)),
                  coverXL: (.media.coverImage.extraLarge | good),
                  coverSmall: (.media.coverImage.medium | good),
                  format: .media.format,
                  country: .media.countryOfOrigin,
                  updatedAt: .updatedAt });
            { watching: items($a; "Ep"), reading: items($m; "Ch") }' > /tmp/anilist.json
          mkdir -p data && cp /tmp/anilist.json data/anilist.json
          cat data/anilist.json

      - name: Commit if changed
        run: |
          git add -N data/anilist.json 2>/dev/null || true
          if git diff --quiet -- data/anilist.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/anilist.json
          git commit -m "Update AniList lists"
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 5; done
          exit 1

  trakt:
    # Independent: movies and TV from Trakt (Apple TV via Omniphile). Posters come from Trakt's own
    # extended=images field (media.trakt.tv), so no TMDB key is needed. The client id is never printed.
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: cfg
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        run: |
          if [ -z "$TRAKT_CLIENT_ID" ]; then echo "TRAKT_CLIENT_ID secret is not set; skipping."; echo "enabled=false" >> "$GITHUB_OUTPUT"; else echo "enabled=true" >> "$GITHUB_OUTPUT"; fi

      - name: Check out
        if: steps.cfg.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Fetch Trakt watching and history
        if: steps.cfg.outputs.enabled == 'true'
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_USER: geekslyy
        run: |
          set -euo pipefail
          t() { curl -fsS --retry 2 -H "Content-Type: application/json" -H "trakt-api-version: 2" -H "trakt-api-key: ${TRAKT_CLIENT_ID}" "https://api.trakt.tv/users/${TRAKT_USER}/$1" 2>/dev/null; }
          if ! t "history?limit=100&extended=images" > /tmp/history.json; then echo "Trakt history request failed; leaving data/trakt.json unchanged."; exit 0; fi
          # /watching answers 204 (empty body) when nothing is playing.
          t "watching?extended=images" > /tmp/watching.json || echo "" > /tmp/watching.json
          [ -s /tmp/watching.json ] || echo 'null' > /tmp/watching.json
          jq -c -n --slurpfile h /tmp/history.json --slurpfile w /tmp/watching.json '
            def img($m): ([($m.images.poster // [])[0], ($m.images.thumb // [])[0]] | map(select(. != null and . != "")) | .[0]) as $u
              | if $u == null then null elif ($u | test("^https?://")) then ($u | sub("^http:"; "https:")) else "https://" + $u end;
            def card($e; $now): if $e.type == "episode" then {
                key: ("show:" + ($e.show.ids.slug // ($e.show.ids.trakt | tostring))), type: "show", title: $e.show.title, year: $e.show.year,
                url: ("https://trakt.tv/shows/" + ($e.show.ids.slug // ($e.show.ids.trakt | tostring))), poster: img($e.show),
                episode: {season: $e.episode.season, number: $e.episode.number, title: $e.episode.title},
                watchedAt: (if $now then null else $e.watched_at end), nowWatching: $now }
              elif $e.type == "movie" then {
                key: ("movie:" + ($e.movie.ids.slug // ($e.movie.ids.trakt | tostring))), type: "movie", title: $e.movie.title, year: $e.movie.year,
                url: ("https://trakt.tv/movies/" + ($e.movie.ids.slug // ($e.movie.ids.trakt | tostring))), poster: img($e.movie),
                episode: null, watchedAt: (if $now then null else $e.watched_at end), nowWatching: $now }
              else empty end;
            ([ ($w[0] | if type == "object" then card(.; true) else empty end) ] + [ ($h[0] // [])[] | card(.; false) ])
            | reduce .[] as $c ([]; if (map(.key) | index($c.key)) == null then . + [$c] else . end)
            | { items: (.[:6] | map(del(.key))) }' > /tmp/trakt.json
          mkdir -p data && cp /tmp/trakt.json data/trakt.json
          jq -c '{items: (.items | length)}' data/trakt.json

      - name: Commit if changed
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          git add -N data/trakt.json 2>/dev/null || true
          if git diff --quiet -- data/trakt.json; then echo "No change."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trakt.json
          git commit -m "Update Trakt watching"
          for i in 1 2 3 4; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep $((i * 5)); done
          exit 1

  books:
    # Independent: books from Hardcover. The token is never printed; a value that already starts with
    # "Bearer" is used as is.
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: cfg
        env:
          HARDCOVER_TOKEN: ${{ secrets.HARDCOVER_TOKEN }}
        run: |
          if [ -z "$HARDCOVER_TOKEN" ]; then echo "HARDCOVER_TOKEN secret is not set; skipping."; echo "enabled=false" >> "$GITHUB_OUTPUT"; else echo "enabled=true" >> "$GITHUB_OUTPUT"; fi

      - name: Check out
        if: steps.cfg.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Fetch Hardcover library
        if: steps.cfg.outputs.enabled == 'true'
        env:
          HARDCOVER_TOKEN: ${{ secrets.HARDCOVER_TOKEN }}
          HARDCOVER_USER: geekslyy
        run: |
          set -euo pipefail
          case "$HARDCOVER_TOKEN" in Bearer\ *|bearer\ *) AUTH="$HARDCOVER_TOKEN" ;; *) AUTH="Bearer $HARDCOVER_TOKEN" ;; esac
          # status_id: 2 = currently reading, 3 = read
          q='query($u:citext!){users(where:{username:{_eq:$u}},limit:1){user_books(where:{status_id:{_in:[2,3]}},order_by:{updated_at:desc},limit:300){status_id rating updated_at book{title slug image{url} contributions(limit:2){author{name}}} user_book_reads(order_by:{finished_at:desc_nulls_last},limit:1){started_at finished_at}}}}'
          body=$(jq -cn --arg q "$q" --arg u "$HARDCOVER_USER" '{query:$q,variables:{u:$u}}')
          if ! curl -fsS --retry 2 https://api.hardcover.app/v1/graphql -H "content-type: application/json" -H "authorization: $AUTH" -d "$body" -o /tmp/hc.json 2>/dev/null; then
            echo "Hardcover request failed; leaving data/books.json unchanged."; exit 0
          fi
          if jq -e '.errors' /tmp/hc.json >/dev/null || ! jq -e '.data.users[0]' /tmp/hc.json >/dev/null; then
            echo "Hardcover returned an error: $(jq -c '.errors[0].message // "no user"' /tmp/hc.json)"; exit 0
          fi
          jq -c '
            def good: (. // "") as $u | if ($u | test("^https://")) then $u else null end;
            def b: { title: .book.title, author: ([.book.contributions[]?.author.name | select(. != null)] | join(", ") | if . == "" then null else . end),
                     cover: (.book.image.url | good), url: (if .book.slug then "https://hardcover.app/books/" + .book.slug else null end),
                     rating: .rating, startedAt: (.user_book_reads[0].started_at // null), finishedAt: (.user_book_reads[0].finished_at // null) };
            (.data.users[0].user_books // []) as $all
            | { reading: [ $all[] | select(.status_id == 2) | b ],
                read: ([ $all[] | select(.status_id == 3) | b ] | sort_by(.finishedAt // "") | reverse
                  | group_by(.finishedAt // "" | .[0:4]) | map({ year: (.[0].finishedAt // "" | .[0:4] | if . == "" then null else tonumber end), books: (sort_by(.finishedAt // "") | reverse) })
                  | sort_by(.year // 0) | reverse) }
            | .total = (.reading | length) + ([.read[].books | length] | add // 0)' /tmp/hc.json > /tmp/books.json
          mkdir -p data && cp /tmp/books.json data/books.json
          jq -c '{reading: (.reading | length), total}' data/books.json

      - name: Commit if changed
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          git add -N data/books.json 2>/dev/null || true
          if git diff --quiet -- data/books.json; then echo "No change."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/books.json
          git commit -m "Update books"
          for i in 1 2 3 4; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep $((i * 5)); done
          exit 1
